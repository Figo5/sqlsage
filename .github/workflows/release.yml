name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node eval/dump-ir.ts --check
      - run: node eval/run.ts
      - run: npm run build
      - run: npm run test:install
      - name: Build release package
        run: |
          mkdir release
          npm pack --pack-destination release
          cd release
          sha256sum *.tgz > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*.tgz release/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --title "SQLSage $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
