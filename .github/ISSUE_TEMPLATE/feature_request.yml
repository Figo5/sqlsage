name: Feature request
description: Suggest a focused SQLSage capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include example SQL/input and the output you would expect.
    validations:
      required: true
